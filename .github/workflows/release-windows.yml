name: release-windows

on:
  push:
    tags:
      - "v*-awg.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build xray.exe (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -v -trimpath -ldflags "-s -w -buildid=" -o xray.exe ./main

      # The Windows client refuses to ship a binary whose tun inbound or AWG
      # env hook is missing, so fail here rather than at vendor-fetch time.
      - name: Verify the binary carries the tun inbound and the AWG env hook
        run: |
          for marker in XRAY_AWG_PARAMS autoSystemRoutingTable autoOutboundsInterface; do
            if ! grep -qa "$marker" xray.exe; then
              echo "missing marker in binary: $marker" >&2
              exit 1
            fi
            echo "found: $marker"
          done

      # The asset name deliberately differs from upstream's matrix output.
      # release.yml in this repo fires on `release: published` - that is, on the
      # release THIS workflow creates - and uploads its own vanilla
      # Xray-windows-64.zip to the same tag. Distinct names keep the two from
      # ever contending for one asset.
      - name: Package
        run: |
          zip -j Xray-windows-64-awg.zip xray.exe
          sha256sum Xray-windows-64-awg.zip | tee Xray-windows-64-awg.zip.sha256

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream="${GITHUB_REF_NAME%%-awg.*}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "AmneziaWG patch on upstream $upstream. Windows amd64 build for the NoNameVPN client." \
            Xray-windows-64-awg.zip Xray-windows-64-awg.zip.sha256
