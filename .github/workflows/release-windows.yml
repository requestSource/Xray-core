name: release-windows

on:
  push:
    tags:
      - "v*-awg.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build xray.exe (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -v -trimpath -ldflags "-s -w -buildid=" -o xray.exe ./main

      # The Windows client refuses to ship a binary whose tun inbound or AWG
      # env hook is missing, so fail here rather than at vendor-fetch time.
      - name: Verify the binary carries the tun inbound and the AWG env hook
        run: |
          for marker in XRAY_AWG_PARAMS autoSystemRoutingTable autoOutboundsInterface; do
            if ! grep -qa "$marker" xray.exe; then
              echo "missing marker in binary: $marker" >&2
              exit 1
            fi
            echo "found: $marker"
          done

      - name: Package
        run: |
          zip -j Xray-windows-64.zip xray.exe
          sha256sum Xray-windows-64.zip | tee Xray-windows-64.zip.sha256

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}"             --title "${{ github.ref_name }}"             --notes "AmneziaWG patch on upstream $(echo "${{ github.ref_name }}" | cut -d- -f1). Windows amd64 build for the NoNameVPN client."             Xray-windows-64.zip Xray-windows-64.zip.sha256
